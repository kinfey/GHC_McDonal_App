[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "golden-order-copilot"
version = "0.1.0"
description = "A McDonald's-inspired ordering simulation powered by GitHub Copilot SDK"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.2,<3",
    "fastapi>=0.116,<1",
    "github-copilot-sdk>=0.1.0",
    "httpx>=0.28,<1",
    "mcp>=1.13,<2",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
